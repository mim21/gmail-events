name: Temporary NLI image repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the known broken hotlink with the restored local asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://www.nli.org.il/media/gbthnokd/jasmin-moallem-960-2.jpg'
          new = 'assets/a28dd8474b8cd1ae6eac6b9b.webp'
          if old not in text:
              print('The broken NLI hotlink is already absent.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit the exact live repair
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'Fix NLI event image to use local asset'
          git push origin HEAD:main
